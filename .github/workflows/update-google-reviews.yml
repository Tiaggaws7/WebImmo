# Met à jour automatiquement les avis Google du site, chaque jour.
#
# 1. Récupère les avis + réponses (via SerpApi, ou l'API Google Business
#    Profile si l'accès est un jour accordé).
# 2. S'il n'y a rien de nouveau : s'arrête (aucun déploiement).
# 3. Sinon : build du site, déploiement sur Firebase Hosting, puis commit
#    de src/data/reviews.json et index.html dans le dépôt.
#
# Configuration : voir AVIS_GOOGLE_AUTOMATIQUES.md
name: Mise à jour des avis Google

on:
  schedule:
    # Tous les jours à 10h17 UTC (6h17 en Guadeloupe).
    - cron: "17 10 * * *"
  # Bouton « Run workflow » dans l'onglet Actions de GitHub, pour lancer à la main.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les avis Google
        id: fetch
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          # Lancement manuel = relecture complète de tous les avis.
          FULL_FLAG: ${{ github.event_name == 'workflow_dispatch' && '--full' || '' }}
        run: node scripts/reviews/fetch-google-reviews.mjs $FULL_FLAG

      - name: Installer les dépendances
        if: steps.fetch.outputs.changed == 'true'
        run: npm ci

      - name: Construire le site
        if: steps.fetch.outputs.changed == 'true'
        env:
          VITE_ENV_FILE: ${{ secrets.VITE_ENV_FILE }}
        run: |
          if [ -z "$VITE_ENV_FILE" ]; then
            echo "::error::Le secret VITE_ENV_FILE (contenu du fichier .env) est manquant."
            exit 1
          fi
          printf '%s\n' "$VITE_ENV_FILE" > .env
          npm run build

      - name: Déployer sur Firebase Hosting
        if: steps.fetch.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: webimmo-6189a
          channelId: live

      - name: Enregistrer les avis dans le dépôt
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/reviews.json index.html
          git commit -m "Mise à jour automatique des avis Google"
          git pull --rebase
          git push
