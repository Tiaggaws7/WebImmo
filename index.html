    <!--
      Démarre les lectures Firestore (REST) avant le téléchargement de React,
      et précharge l'image hero de l'accueil.

      Le préchargement est limité à la page qui l'utilise : sur /Acheter,
      /Vendre, /EliseBUIL, /Estimation ou une fiche bien, le hero de l'accueil
      n'est jamais affiché et ses ~100 Ko retardaient le JavaScript et les
      données de la page.
    -->
    <script>
      (function () {
        var KEY = '%VITE_FIREBASE_API_KEY%';
        var APP_CHECK_SITE_KEY = '%VITE_RECAPTCHA_SITE_KEY%';
        var APP_CHECK_ENABLED =
          APP_CHECK_SITE_KEY.length > 0 && APP_CHECK_SITE_KEY.indexOf('%VITE_') !== 0;
        var BASE = 'https://firestore.googleapis.com/v1/projects/webimmo-6189a/databases/(default)/documents/';
        var preloaded = {};

        // Route demandée : chaque page ne télécharge que les données et les
        // images dont elle a besoin (le HTML est le même pour toutes les routes).
        var PAGE = (location.pathname || '/').replace(/\/+$/, '').toLowerCase() || '/';
        var NEEDS_SETTINGS = PAGE === '/';
        var NEEDS_HOUSES =
          PAGE === '/' || PAGE === '/acheter' || PAGE === '/vendre' || PAGE === '/elisebuil';

        function get(path) {
          return fetch(BASE + path + (path.indexOf('?') === -1 ? '?' : '&') + 'key=' + KEY)
            .then(function (response) { return response.ok ? response.json() : null; })
            .catch(function () { return null; });
        }

        function preload(url, srcset, sizes) {
          if (!url || preloaded[url]) return;
          preloaded[url] = true;
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = url;
          if (srcset) {
            link.imageSrcset = srcset;
            link.imageSizes = sizes;
          }
          link.setAttribute('fetchpriority', 'high');
          document.head.appendChild(link);
        }

        var LOCAL_SRCSET = '/hero/hero-640.webp 640w, /hero/hero-960.webp 960w, /hero/hero-1280.webp 1280w, /hero/hero-1600.webp 1600w';
        var OPTIMIZED_HERO_MARKER = 'settings%2Fhero-image-1791818766770';
        function preloadLocal() {
          preload('/hero/hero-1600.webp', LOCAL_SRCSET, '100vw');
        }

        // Le hero actuel existe aussi en WebP optimisé local : on évite ainsi
        // de télécharger le fichier Firebase de 240 Ko.
        function localHero(url) {
          return url && url.indexOf(OPTIMIZED_HERO_MARKER) !== -1
            ? '/hero/hero-1600.webp'
            : url;
        }

        // Sur l'accueil, le hero est l'élément LCP : on lance son téléchargement
        // immédiatement, sans attendre la réponse Firestore.
        if (NEEDS_SETTINGS) preloadLocal();

        // App Check exige un jeton obtenu par le SDK : le préchargement REST
        // direct n'est possible que lorsque App Check est désactivé.
        if (!APP_CHECK_ENABLED) {
          var prefetched = {};
          if (NEEDS_SETTINGS) prefetched.settings = get('settings/homepage');
          if (NEEDS_HOUSES) prefetched.houses = get('houses?pageSize=300');
          window.__WEB_IMMO_FS__ = prefetched;

          if (NEEDS_SETTINGS) {
            var cached = null;
            try { cached = localStorage.getItem('home_hero_bg'); } catch (error) { /* stockage indisponible */ }
            if (cached) {
              var cachedHero = localHero(cached);
              if (cachedHero.indexOf('/hero/') !== 0) preload(cachedHero);
            }

            prefetched.settings.then(function (doc) {
              var url = doc && doc.fields && doc.fields.heroImage && doc.fields.heroImage.stringValue;
              if (url) {
                var hero = localHero(url);
                window.__WEB_IMMO_HERO__ = hero;
                if (hero.indexOf('/hero/') !== 0) preload(hero);
              }
            });
          }
        }
      })();
    </script>
